<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas de Productos</title>
    <link rel="stylesheet" href="productos.css">
</head>
<body>

    <header>
        <h1>Trabajo Práctico: Tarjetas de Producto</h1>
        <p>Galería de Productos</p>
    </header>

    <main class="contenedor-productos">

        <article class="tarjeta">
            <div class="imagen-producto imagen-auriculares"></div>

            <h2>Auriculares Pro</h2>

            <p class="descripcion">
                Auriculares inalámbricos con excelente calidad de sonido.
            </p>

            <button class="boton-compra">Comprar</button>
        </article>

        <article class="tarjeta">
            <div class="imagen-producto imagen-teclado"></div>

            <h2>Teclado Mecánico</h2>

            <p class="descripcion">
                Teclado con retroiluminación RGB y switches suaves.
            </p>

            <button class="boton-compra">Comprar</button>
        </article>

    </main>

    <footer>
        <p>Resolución del Trabajo Práctico</p>
    </footer>

</body>
</html>
